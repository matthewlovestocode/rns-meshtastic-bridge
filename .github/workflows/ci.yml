name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package and test dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"

      - name: Run tests and enforced branch coverage
        run: python -m pytest

      - name: Install and run Pyright
        run: python -m pip install pyright && pyright src tests

  package:
    name: Build distribution
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Build wheel and source archive
        run: python -m pip install --upgrade pip build twine && python -m build

      - name: Validate package metadata and README rendering
        run: python -m twine check dist/*

      - name: Install the built wheel
        run: python -m pip install dist/*.whl

      - name: Smoke-test installed console commands
        run: |
          rns-bridge-receive --help
          rns-bridge-service --help
          rns-bridge-reticulum-destination --help
          rns-bridge-transmit-check --help
          rns-bridge-send-message --help
